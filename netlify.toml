[build]
  base = "."
  command = "npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  included_files = ["backend/src/**", "backend/node_modules/**"]
  node_bundler = "esbuild"

[functions.api]
  included_files = ["backend/src/**", "backend/node_modules/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
